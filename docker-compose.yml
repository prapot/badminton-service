version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres-strapi
    restart: always
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: strapi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
